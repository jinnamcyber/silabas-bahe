<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>葡語分音節 · Divisão silábica · 拔河</title>
<style>
:root{--sand:#F5D878;--ink:#24332E;--red:#E8413C;--blue:#2457E6;--paper:#FFFCEF;--ok:#287445;--grass:#88B963;--edge:.32vh solid var(--ink);--shadow:0 .45vh 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
html,body{height:100%}body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button,input,select{outline-offset:.4vh}button:focus-visible,input:focus-visible,select:focus-visible{outline:.45vh solid #936121}button{border:var(--edge);background:var(--paper);min-height:6vh;font-weight:900}button:active:not(:disabled){translate:0 .3vh;box-shadow:0 .1vh 0 var(--ink)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}.screen.on{display:flex}
#start{align-items:center;justify-content:center;gap:2vh;text-align:center;padding:3vh 7vw;background:radial-gradient(circle at 8% 20%,#FFFCEF 0 1vh,transparent 1.1vh),radial-gradient(circle at 90% 68%,#FFFCEF 0 1.5vh,transparent 1.6vh),linear-gradient(165deg,#F8E5A9,var(--sand));isolation:isolate;overflow:hidden}
#start:before,#start:after{content:"";position:absolute;width:28vw;height:28vw;border:var(--edge);border-radius:50%;background:#A4C983;z-index:-1;bottom:-20vw;left:-5vw;box-shadow:0 -1vh 0 #FFFCEF}#start:after{left:auto;right:-5vw;background:#88B963}
.eyebrow{font-size:1.8vh;font-weight:900;letter-spacing:.35vw;background:var(--ink);color:var(--paper);padding:.65vh 2vw;border-radius:1vh;transform:rotate(-2deg)}
#start h1{font-size:10vh;line-height:1.1;font-weight:1000;letter-spacing:.4vw;color:var(--paper);-webkit-text-stroke:.55vh var(--ink);paint-order:stroke fill;text-shadow:.3vw .65vh 0 var(--ink);transform:rotate(-2deg)}#start h1 small{font-size:2.1vh;letter-spacing:.3vw;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;margin-top:1.8vh;display:block}
.start-rule{font-size:2.2vh;font-weight:700}.teams{display:flex;align-items:center;gap:3vw;margin:1vh 0}.team-set{position:relative;padding:1vh 1vw 1.2vh;border:var(--edge);border-radius:2vh;box-shadow:var(--shadow);background:var(--paper);transform:rotate(-2deg)}.team-set.blue{transform:rotate(2deg)}.team-set:before{content:"左邊集合 · 紅隊";display:block;font-size:1.6vh;font-weight:900;text-align:left;margin-bottom:.6vh}.team-set.blue:before{content:"右邊集合 · 藍隊"}.team-set input{width:25vw;height:6.6vh;border:var(--edge);border-radius:1vh;text-align:center;font-size:3.7vh;font-weight:900;color:white;background:var(--red)}.team-set.blue input{background:var(--blue)}.vs{font-size:3.3vh;font-weight:1000;border:var(--edge);border-radius:50%;background:var(--paper);padding:1.8vh 1vw;transform:rotate(-9deg);box-shadow:var(--shadow)}
.opts{width:84vw;display:grid;grid-template-columns:repeat(6,1fr);gap:1.2vh 1vw;text-align:left}.opts label{grid-column:span 2;border:var(--edge);border-radius:1.5vh;background:var(--paper);padding:.8vh 1.2vw;box-shadow:0 .35vh 0 #B19A56;font-size:1.7vh;font-weight:900;min-width:0}.opts label:nth-child(n+4){grid-column:span 3}.opts select{display:block;width:100%;max-width:100%;height:6vh;padding:0 2vw 0 0;font-size:2.15vh;font-weight:800;border:0;appearance:none;background:linear-gradient(45deg,transparent 50%,var(--ink) 50%) calc(100% - .7vw) 50%/.65vw .65vw no-repeat,linear-gradient(135deg,var(--ink) 50%,transparent 50%) calc(100% - .05vw) 50%/.65vw .65vw no-repeat}
.big{font-size:3.5vh;padding:1.1vh 5vw;border-radius:2vh;background:var(--ink);color:var(--paper);box-shadow:0 .55vh 0 #728264;min-height:7vh}.big:after{content:" ↗";color:var(--sand)}.note{font-size:1.7vh;font-weight:700;min-height:2vh}.tiny{font-size:1.7vh;background:transparent;border:0;text-decoration:underline;padding:0 1vw;min-height:6vh}.start-admin{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}.start-admin .note{font-size:1.6vh}
.arena{flex:0 0 28vh;position:relative;overflow:hidden;background:#BDE1E0;border-bottom:var(--edge)}.arena>svg{position:absolute;inset:0;width:100%;height:100%}.score{position:absolute;top:1.2vh;border:var(--edge);border-radius:1.4vh;background:var(--red);color:white;font-size:2.5vh;font-weight:900;padding:.65vh 1.5vw;box-shadow:var(--shadow);max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score.l{left:2vw;rotate:-2deg}.score.r{right:2vw;background:var(--blue);rotate:2deg}.score:before{content:"⚑ ";color:var(--sand)}
.callout{position:absolute;left:50%;top:50%;max-width:84vw;width:max-content;transform:translate(-50%,-50%) scale(0) rotate(-5deg);font-size:5.3vh;font-weight:1000;line-height:1.2;padding:1.4vh 2.3vw;background:var(--paper);border:.5vh solid var(--ink);border-radius:2vh;box-shadow:.5vw .8vh 0 var(--ink);text-align:center;pointer-events:none;transition:transform .25s cubic-bezier(.2,1.5,.5,1)}.callout.show{transform:translate(-50%,-50%) scale(1) rotate(-5deg)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:1.1vh 2vw 1vh;gap:1vh;background:var(--paper)}.meta{display:flex;align-items:center;justify-content:space-between;gap:1vw;font-size:1.8vh;font-weight:900;min-height:3.3vh}.meta>div:first-child{display:flex;gap:.65vw}.tag{display:inline-block;white-space:nowrap;padding:.4vh .85vw;border: .23vh solid var(--ink);border-radius:.8vh;background:#F5E4AC}#domTag{background:#DCEBD0}#typeTag{background:var(--ink);color:var(--paper)}.timer{position:relative;width:14vw;flex-shrink:0;height:2.6vh;background:#E6DDC6;border:var(--edge);border-radius:2vh;overflow:hidden}.timer i{display:block;width:100%;height:100%;background:#6DAB59;transition:width 1s linear}.timer:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 2.4vw,#FFFCEF 2.4vw 2.55vw)}.timer i.low{background:var(--red);animation:urgent .55s steps(2) infinite}
.q b{background:var(--sand);border-radius:.5vh;padding:0 .35vw;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.q{font-size:3.05vh;line-height:1.35;font-weight:900;padding:1.15vh 1.5vw 1.15vh 2.1vw;border:var(--edge);border-radius:1.4vh;background:white;box-shadow:0 .4vh 0 #D7CEB7;white-space:pre-line;max-height:12vh;min-height:6.6vh;overflow:auto;border-left:1vw solid var(--sand);flex-shrink:0}
.sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2vw;flex:1;min-height:0}.side{--team:var(--red);display:flex;flex-direction:column;gap:.7vh;min-height:0;padding:.8vh .8vw;border:var(--edge);border-radius:1.6vh;background:#FAE5DB;position:relative}.side.s1{--team:var(--blue);background:#E2EAF8}.head{display:flex;align-items:center;justify-content:space-between;gap:1vw;min-height:3.3vh;font-size:2vh;font-weight:900;color:var(--team);padding:0 .3vw}.head:after{content:"準備作答";font-size:1.5vh;border:.2vh solid currentColor;border-radius:1vh;padding:.2vh .7vw}.side.done .head:after{content:"✓ 已交卷";background:var(--team);color:white;border-color:var(--team)}.side.done{border-color:var(--team)}.side.locked button{pointer-events:none}.body{flex:1;min-height:0;overflow:auto;padding:.2vh .15vw .6vh;scrollbar-width:thin}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.1vh .8vw}.col{display:flex;flex-direction:column;gap:.7vh}.opt{position:relative;display:flex;align-items:center;gap:.8vw;min-height:6vh;flex-shrink:0;padding:.65vh .9vw;border-radius:1.2vh;background:var(--paper);box-shadow:0 .35vh 0 var(--ink);font-size:2.8vh;text-align:left;line-height:1.2;transition:background .15s,transform .15s;overflow-wrap:anywhere}.opt b{display:grid;place-items:center;width:3.7vh;height:3.7vh;flex-shrink:0;background:var(--team);color:white;font-size:2.1vh;border-radius:.8vh;border:.2vh solid var(--ink)}.opt span{flex:1}.grid2 .opt{font-size:3.1vh}.grid2 .opt b{align-self:flex-start}.opt.picked{background:var(--sand);box-shadow:0 .15vh 0 var(--ink);transform:translateY(.2vh)}.opt.picked:after{content:"●";font-size:2vh}.opt.right,.np-display.right{background:#D8EDBC;border-color:var(--ok);box-shadow:0 .35vh 0 var(--ok)}.opt.right:after{content:"✓";color:var(--ok);font-size:3vh}.opt.wrong,.np-display.wrong{background:#F8C9BE;border-color:#A42A26;box-shadow:0 .35vh 0 #A42A26}.opt.wrong:after{content:"×";color:#A42A26;font-size:3vh}.opt.dim{background:#EAE7DE;color:#777B73;border-color:#A2A79C;box-shadow:0 .25vh 0 #A2A79C}.opt.dim b{background:#777B73}.confirm{border-radius:1.2vh;min-height:6vh;padding:.5vh 3vw;font-size:2.6vh;background:var(--team);color:white;box-shadow:0 .35vh 0 var(--ink);flex-shrink:0;width:100%;margin-top:auto}.confirm:disabled{background:#D0D2C9;color:#646B61;border-color:#889080;box-shadow:0 .25vh 0 #889080}.np-display{font-size:3.2vh;line-height:1.1;min-height:6vh;border:var(--edge);border-radius:1vh;background:#FFFCEF;box-shadow:inset 0 .4vh 0 #E1DBC5;text-align:right;padding:.9vh 1vw;font-weight:900;font-variant-numeric:tabular-nums;flex-shrink:0}.np-display small{font-size:2vh;margin-left:1vw}.np-keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.65vh .7vw;flex-shrink:0}.np-keys button{min-height:6vh;border-radius:1vh;background:#FFFCEF;box-shadow:0 .3vh 0 var(--ink);font-size:2.9vh}.np-keys button:nth-child(4n){background:#F1DDA4}.ord{display:flex;flex-direction:column;gap:.8vh}.ord .opt:before{content:"⠿";color:#788172;font-size:2.5vh}.ord .opt.sel{background:var(--sand);outline:.3vh dashed var(--ink);outline-offset:-.8vh}.ord .opt{padding-right:1.5vw}.body.col:has(.ord):before{content:"拖動卡片排次序，或點兩張交換";font-size:1.7vh;font-weight:700;flex-shrink:0}.body.col>div:last-child:not(.np-keys):not(.np-display):not(.ord){flex-shrink:0}
.foot{display:flex;gap:1vw;align-items:center;min-height:6vh;padding-right:8vw;padding-left:11vw;flex-shrink:0}.why{opacity:0;flex:1;font-size:2vh;font-weight:700;line-height:1.3;max-height:6vh;overflow:auto}.why.show{opacity:1}.next{visibility:hidden;min-height:6vh;flex-shrink:0;border-radius:1.2vh;background:var(--ink);color:var(--paper);padding:.6vh 2vw;font-size:2.5vh;box-shadow:0 .3vh 0 #71816A}.next.show{visibility:visible}.fs{position:absolute;right:2vw;bottom:1vh;font-size:1.7vh;border-radius:1vh;padding:.5vh .8vw;min-height:6vh;background:#EEE9DB}
#win{align-items:center;justify-content:center;text-align:center;gap:2vh;padding:3vh;isolation:isolate;overflow:hidden;color:var(--paper)}#win.red{background:#C93631}#win.blue{background:#204BC3}#win.draw{background:#38584B}#win:before{content:"";position:absolute;inset:-40vh -30vw;background:repeating-conic-gradient(from 0deg,transparent 0deg 20deg,#FFFCEF0D 20deg 40deg);z-index:-1;animation:sunburst 80s linear infinite}#win:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 7vw,#F5D878 7vw 8vw,transparent 8vw 13vw,#FFFCEF 13vw 13.5vw,transparent 13.5vw 20vw) top/100% 2vh no-repeat;animation:ribbons 2s ease-in-out infinite alternate}#win h2{font-size:7.5vh;line-height:1.15;max-width:88vw;-webkit-text-stroke:.5vh var(--ink);paint-order:stroke fill;text-shadow:0 .65vh 0 var(--ink)}#win p{font-size:2.8vh;font-weight:800}#win .miss{font-size:2.2vh;line-height:1.5;max-width:80vw;max-height:15vh;overflow:auto;background:var(--paper);color:var(--ink);border:var(--edge);border-radius:1.6vh;padding:1.2vh 2vw;box-shadow:var(--shadow)}#win .big{background:var(--sand);color:var(--ink)}#win .big:after{color:var(--ink)}.trophy{width:17vw;height:22vh;overflow:visible;filter:drop-shadow(0 .6vh 0 #24332E);animation:trophy 2.4s ease-in-out infinite}
#game[data-result="0"] .score.l,#game[data-result="1"] .score.r{animation:cheer .35s ease-in-out 4}
@keyframes urgent{50%{filter:brightness(1.5)}}@keyframes cheer{to{translate:0 -1.5vh;rotate:-3deg}}@keyframes trophy{50%{transform:rotate(4deg)}}@keyframes sunburst{to{transform:rotate(360deg)}}@keyframes ribbons{to{transform:translateY(1vh)}}
@media(max-aspect-ratio:3/2){.arena{flex-basis:24vh}.panel{gap:.8vh}.meta{font-size:1.55vh;gap:.5vw}.tag{padding:.4vh .6vw}.timer{width:12vw}.q{font-size:2.8vh}.opts{width:90vw}.opts select{font-size:2vh}.team-set input{width:29vw}.grid2 .opt{font-size:2.7vh}.score{font-size:2.2vh}.start-admin .note{flex-basis:100%}#start{gap:1.5vh}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== 白板實測後的調整（2026-09-11）：字級加大、題目欄撐滿、拖拉排序、靜音鍵 ===== */
.panel{padding:1vh 1.6vw 1vh}
.meta{font-size:2.3vh}.meta .tag{font-size:2.2vh}
.q{font-size:4.4vh;line-height:1.3;max-height:19vh;min-height:8.5vh;padding:1.4vh 2vw 1.4vh 2.4vw;width:100%}
.opt{font-size:4.1vh;min-height:8vh;gap:1.4vw}.opt b{width:5.2vh;height:5.2vh;font-size:3vh;border-radius:1.1vh}
.grid2 .opt{font-size:4.6vh;min-height:9vh}
.col .opt,.ord .opt{font-size:3.9vh;min-height:6.8vh}
.np-display{font-size:5vh;min-height:7vh}.np-keys button{font-size:4.2vh;min-height:6.2vh}
.confirm{font-size:3.4vh}
.why{font-size:2.7vh;max-height:8vh}
.ord .opt{touch-action:none;transition:transform .12s;position:relative}
.ord .opt.dragging{transition:none;z-index:5;box-shadow:0 1.2vh 1.6vh rgba(0,0,0,.25);background:#FFF3B0}
#muteBtn{right:auto;left:2vw}
@media (prefers-reduced-motion:reduce){.ord .opt{transition:none}}

/* ===== 遊戲專屬樣式（games/<id>/game.css） ===== */
/* games/tug/game.css —— 拔河專屬：繩子、兩隊小孩、結束畫面的獲勝／落敗姿勢 */
.kid-motion{transform-box:fill-box;transform-origin:60% 100%;animation:ready 2.4s ease-in-out infinite}
.kid-1 .kid-motion{animation-delay:-.6s}.kid-2 .kid-motion{animation-delay:-1.2s}.kid-3 .kid-motion{animation-delay:-1.8s}
.dust{opacity:0}
#game[data-result="0"] #teamL .kid-motion,#game[data-result="1"] #teamR .kid-motion{animation:heave .7s ease-in-out 2}
#game[data-result="1"] #teamL .kid-motion,#game[data-result="0"] #teamR .kid-motion{animation:stumble .65s ease-in-out 2}
#game[data-result="none"] .rope-texture,#game[data-result="timeout"] .rope-texture{animation:shake .16s ease-in-out 6}
#game[data-result="none"] .dust,#game[data-result="timeout"] .dust{animation:dust 1.2s ease-out}
@keyframes ready{50%{transform:rotate(-1deg)}}
@keyframes heave{40%{transform:rotate(-9deg)}75%{transform:rotate(-4deg)}}
@keyframes stumble{35%{transform:rotate(9deg)}65%{transform:rotate(-3deg)}}
@keyframes shake{50%{transform:translateY(.4vh)}}
@keyframes dust{20%{opacity:.8}100%{opacity:0;transform:translateY(-1vh)}}
.victory-kids{position:absolute;bottom:2vh;width:20vw;height:25vh;overflow:visible;z-index:-1}
.victory-kids.red-kids{left:1vw}.victory-kids.blue-kids{right:1vw}
#win.red .red-kids,#win.blue .blue-kids{animation:cheer .7s ease-in-out infinite alternate}
#win.red .blue-kids,#win.blue .red-kids{transform:translateY(7vh) rotate(12deg);opacity:.8}
.seated{display:none}
#win.red .blue-kids .standing,#win.blue .red-kids .standing{display:none}
#win.red .blue-kids .seated,#win.blue .red-kids .seated{display:inline}
#win.red .blue-kids,#win.blue .red-kids{transform:none;opacity:1}
@media(max-aspect-ratio:3/2){.victory-kids{width:17vw}}

</style>
</head>
<body>

<section id="start" class="screen on">
  <div class="eyebrow">Português · 一起聽，一起分節</div><h1>搶答拔河<small>答對向自己拉 · 繩結過線就獲勝</small></h1><p class="start-rule">兩隊同時作答 · 答對向自己拉 · 繩結過線就獲勝</p>
  <div class="teams">
    <div class="team-set red"><input aria-label="紅隊名稱" id="nameL" value="紅隊" maxlength="8"></div>
    <div class="vs">VS</div>
    <div class="team-set blue"><input aria-label="藍隊名稱" id="nameR" value="藍隊" maxlength="8"></div>
  </div>
  <div class="opts">
    <label>拉過幾格獲勝<select id="winAt"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>8</option></select></label>

    <label>題數<select id="nq"><option>6</option><option>8</option><option selected>10</option><option>12</option><option>15</option></select></label>
    <label>時限<select id="tlimit"><option value="1" selected>預設（選擇 30 秒、輸入排序 45 秒）</option><option value="0">不限時</option><option value="0.67">短（20／30 秒）</option><option value="1.5">長（45／68 秒）</option></select></label>
    <label>範圍<select id="scope"></select></label>
    <label id="groupLabel" hidden>科目<select id="group"></select></label>
  </div>
  <button class="big" id="startBtn">開始拔河</button>
  <div class="note" id="startNote"></div>
  <div class="start-admin">
    <span class="note" id="bankinfo"></span>
    &nbsp;·&nbsp;<button class="tiny" id="exportBtn">匯出紀錄 CSV</button>
    &nbsp;·&nbsp;<button class="tiny" id="clearBtn">清除紀錄</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="arena" id="arena">
    <svg viewBox="0 0 1600 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <pattern id="ropeTwist" width="24" height="18" patternUnits="userSpaceOnUse"><rect width="24" height="18" fill="#F5D878"/><path d="M-8 18L4 0M4 18L16 0M16 18L28 0" stroke="#98703F" stroke-width="5"/></pattern>
        <pattern id="crowd" width="84" height="42" patternUnits="userSpaceOnUse"><path d="M8 40v-8q9-12 18 0v8" fill="#E8413C"/><circle cx="17" cy="19" r="8" fill="#24332E"/><path d="M49 40v-8q9-12 18 0v8" fill="#2457E6"/><circle cx="58" cy="19" r="8" fill="#98703F"/></pattern>
      </defs>
      <rect width="1600" height="320" fill="#BDE1E0"/>
      <g stroke="#24332E" stroke-width="5" stroke-linejoin="round">
      <circle cx="1290" cy="54" r="32" fill="#F5D878"/>
      <path d="M190 65q-12-27 14-31 9-37 40-17 31-7 32 25 25 0 20 23Z M970 49q-7-24 18-25 10-30 35-12 30-5 29 22 22 0 18 15Z" fill="#FFFCEF"/>
      <path d="M0 165Q150 34 330 150Q460 60 620 157Q800 62 990 153Q1180 57 1370 150Q1500 90 1600 154V230H0Z" fill="#9DBE94"/>
      <path d="M260 153v-40h1080v40" fill="#F5D878"/><path d="M285 112v-35h1030v35" fill="#FFFCEF"/>
      <path d="M290 111V79h1018v32" fill="url(#crowd)" stroke="none"/>
      <path d="M80 64Q800 137 1520 64" fill="none"/>
      <path d="M180 74l36 3-22 28Z M470 96l36 2-20 29Z M1070 96l36-2-16 29Z M1360 77l36-3-14 30Z" fill="#E8413C"/>
      <path d="M325 87l36 3-22 27Z M615 103l36 1-20 28Z M925 103l36-1-16 30Z M1215 87l36-3-14 30Z" fill="#2457E6"/>
      <path d="M0 162H1600V320H0Z" fill="#88B963"/>
      <path d="M0 227Q800 210 1600 227V304H0Z" fill="#DEAE73"/>
      </g>
      <path d="M0 243Q800 226 1600 243M0 294H1600" fill="none" stroke="#FFFCEF" stroke-width="5"/>
      <path d="M280 243h250v48H280Z" fill="#E8413C" opacity=".25"/><path d="M1070 243h250v48h-250Z" fill="#2457E6" opacity=".25"/>
      <path d="M110 309l-6-10m6 10 9-9M680 313l-6-10m6 10 9-9M1450 313l-6-10m6 10 9-9" stroke="#426544" stroke-width="4" fill="none"/>
      <line id="goalL" x1="500" y1="221" x2="500" y2="313" stroke="#B72E2A" stroke-width="10" stroke-dasharray="14 8"/>
      <line id="goalR" x1="1100" y1="221" x2="1100" y2="313" stroke="#183FA8" stroke-width="10" stroke-dasharray="14 8"/>
      <path d="M800 255v60" stroke="#FFFCEF" stroke-width="7"/>
      <g stroke="#24332E" stroke-width="5" stroke-linejoin="round"><path d="M800 293v-60h44l-12 13 12 13h-44" fill="#F5D878"/><ellipse cx="800" cy="298" rx="12" ry="4" fill="#24332E"/></g>

<script>
/* core/util.js */
/* core/util.js —— 所有遊戲共用：亂數、洗牌、題型分散、顯示順序、日期 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};
  // ---------- 隨機 ----------
  T.seededRng = function (seed) {
    let s = (seed >>> 0) || 1;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  };
  T.shuffle = function (arr, rng) {
    const a = arr.slice(); rng = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };

  // ---------- 題型分散：同一題型不連續超過 3 題（反覆修補直到無違規或無法改善） ----------
  T.spreadTypes = function (list) {
    const out = list.slice();
    const runAt = (a, i) => { let r = 1; for (let k = i; k > 0 && a[k].type === a[k - 1].type; k--) r++; return r; };   // 以 i 結尾的連續長度
    const violations = a => a.filter((_, k) => runAt(a, k) > 3).length;
    for (let guard = 0; guard < 100; guard++) {
      const cur = violations(out);
      if (cur === 0) break;
      const i = out.findIndex((_, k) => runAt(out, k) > 3);
      let fixed = false;
      for (let j = 0; j < out.length && !fixed; j++) {
        if (out[j].type === out[i].type) continue;
        const trial = out.slice(); [trial[i], trial[j]] = [trial[j], trial[i]];
        if (violations(trial) < cur) { out.splice(0, out.length, ...trial); fixed = true; }
      }
      if (!fixed) break;      // 例如 7 個同題型加 1 個其他：無解，照原樣回傳
    }
    return out;
  };

  // ---------- 顯示順序（兩隊看到同一順序，公平） ----------
  T.prepareView = function (item, rng) {
    const q = Object.assign({}, item);
    if (item.type === "numpad") { q.view = null; return q; }
    const idx = item.options.map((_, i) => i);
    let v = T.shuffle(idx, rng);
    if (item.type === "order") {
      let guard = 0;
      while (v.every((x, i) => x === item.answer[i]) && guard++ < 20) v = T.shuffle(idx, rng);
    }
    q.view = v;
    return q;
  };

  // ---------- 日期 ----------
  T.daysBetween = function (a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); };
  T.todayStr = function (d) { d = d || new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
})();

</script>
<script>
/* core/pick.js */
/* core/pick.js —— 抽題。對所有題庫與所有遊戲通用。
   範圍（scope）有四種寫法，題庫在 meta.json 宣告自己支援哪幾種：
     all          全部
     only:<主題>  只出這個主題
     upto:<主題>  出這個主題及之前所有主題，其中七成出這個主題（需要 orderedTopics）
     taught       出課表算出來的已教主題，七成已教、三成全範圍（需要 taughtSet）
   優先次序：新鮮度（14 天內沒出過）> 七三分 > 層次 2/5/3 > 題型平均 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};

  T.pick = function (bank, opts) {
    const rng = opts.rng || Math.random;
    const n = opts.n || 10;
    const notes = { fallbackAll: false, repeats: 0 };
    let scope = opts.scope || "all";
    const m = /^(upto|only):(.+)$/.exec(scope);
    const mode = m ? m[1] : scope, cur = m ? m[2] : null;
    const ordered = opts.orderedTopics || [];
    const groupKey = opts.groupKey, group = opts.group;

    // 依群組（例如 TIMSS 的科目）先篩一層；指定單一主題時主題優先，不再看群組
    const byGroup = i => !groupKey || !group || group === "混合" || i[groupKey] === group;

    let pool;
    if (mode === "only") pool = bank.filter(i => i.topic === cur);
    else if (mode === "upto") {
      const at = ordered.indexOf(cur);
      pool = bank.filter(i => byGroup(i) && ordered.indexOf(i.topic) >= 0 && ordered.indexOf(i.topic) <= at);
    } else pool = bank.filter(byGroup);

    if (mode === "taught" && (!opts.taughtSet || opts.taughtSet.size === 0)) { scope = "all"; notes.fallbackAll = true; }
    if (!pool.length) { pool = bank.slice(); notes.fallbackAll = true; }

    // 七三分：upto 時「當前主題」佔七成；taught 時「已教主題」佔七成；其餘不分
    const isHot = mode === "upto" ? (i => i.topic === cur)
                : (mode === "taught" && !notes.fallbackAll) ? (i => opts.taughtSet.has(i.topic))
                : null;

    const levelBudget = { "知道": Math.round(n * 0.2), "應用": Math.round(n * 0.5) };
    levelBudget["推理"] = n - levelBudget["知道"] - levelBudget["應用"];
    const typeCount = { mcq: 0, numpad: 0, order: 0, multi: 0 };
    const chosen = [], chosenIds = new Set();
    const age = i => opts.recent.has(i.id) ? T.daysBetween(opts.recent.get(i.id), opts.today) : Infinity;

    // 同一局裡不要重複考同一個詞（題目可帶 word 欄；沒有就不管）。軟性限制：沒別的可選才放寬
    const chosenWords = new Set();
    // 從 list 取最多 count 題，只取「距上次出題超過 days 天」的；回傳實際取到的數目
    function take(list, count, days) {
      let got = 0;
      while (got < count) {
        let cands = list.filter(i => !chosenIds.has(i.id) && (days < 0 || age(i) > days));
        const fresh = cands.filter(i => !i.word || !chosenWords.has(i.word));
        if (fresh.length) cands = fresh;
        if (!cands.length) break;
        // 先選剩餘預算最多的層次；同層次內選目前最少的題型
        const levels = Object.keys(levelBudget).filter(l => levelBudget[l] > 0 && cands.some(c => c.level === l))
          .sort((a, b) => levelBudget[b] - levelBudget[a]);
        const byLevel = levels.length ? cands.filter(c => c.level === levels[0]) : cands;
        const minType = Math.min(...byLevel.map(c => typeCount[c.type]));
        const best = byLevel.filter(c => typeCount[c.type] === minType);
        const it = best[Math.floor(rng() * best.length)];
        const q = Object.assign({}, it, { repeat: age(it) <= 7 });
        if (q.repeat) notes.repeats++;
        chosen.push(q); chosenIds.add(it.id); typeCount[it.type]++;
        if (it.word) chosenWords.add(it.word);
        if (levelBudget[it.level] > 0) levelBudget[it.level]--;
        got++;
      }
      return got;
    }

    // 七成配額，但「熱門題」新鮮的（14 天內沒出過）太少時自動降低——學期初只教了兩三個主題，
    // 硬要七成從幾題裡抽，每一局都是同一批；改成最多拿一半的新鮮熱門題，其餘交給全範圍
    const hotFresh = isHot ? pool.filter(i => isHot(i) && age(i) > 14).length : 0;
    const tTarget = isHot ? Math.min(Math.round(n * 0.7), Math.max(0, Math.floor(hotFresh / 2))) : 0;
    notes.hotTarget = tTarget;
    const inT = isHot ? pool.filter(isHot) : [], outT = isHot ? pool.filter(i => !isHot(i)) : pool;
    const tGot = () => isHot ? chosen.filter(isHot).length : 0;
    for (const days of [14, 7, -1]) {
      let need = n - chosen.length;
      if (need <= 0) break;
      need -= take(inT, Math.min(need, Math.max(0, tTarget - tGot())), days);
      need -= take(outT, Math.min(need, Math.max(0, (n - tTarget) - (chosen.length - tGot()))), days);
      take(pool, need, days);
    }

    // 推理題放後半：非推理先、推理後，各自打亂，再分散題型
    const nonR = T.shuffle(chosen.filter(q => q.level !== "推理"), rng);
    const R = T.shuffle(chosen.filter(q => q.level === "推理"), rng);
    return { items: T.spreadTypes(nonR.concat(R)), notes };
  };
})();

</script>
<script>
/* core/records.js */
/* core/records.js —— 作答紀錄（localStorage）與 CSV 匯出。
   儲存 key 依題庫分開，換題庫不會蓋掉別人的紀錄。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};

  T.RECORD_COLS = ["date", "session_id", "item_id", "topic", "level", "type",
                   "red_correct", "blue_correct", "red_ms", "blue_ms", "repeat"];

  T.records = function (storage, bankId) {
    const KEY = "tug.records." + (bankId || globalThis.BANK_ID || "default");
    storage = storage || globalThis.localStorage;
    function load() { try { const v = JSON.parse(storage.getItem(KEY) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } }
    function save(rows) { storage.setItem(KEY, JSON.stringify(rows)); }
    return {
      load,
      append(rows) { save(load().concat(rows)); },
      clear() { storage.removeItem(KEY); },
      recentMap() {
        const m = new Map();
        for (const r of load()) if (!m.has(r.item_id) || r.date > m.get(r.item_id)) m.set(r.item_id, r.date);
        return m;
      },
      toCSV(rows) {
        const esc = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
        return "﻿" + [T.RECORD_COLS.join(",")]
          .concat(rows.map(r => T.RECORD_COLS.map(c => esc(r[c])).join(","))).join("\n");
      },
    };
  };
})();

</script>
<script>
/* core/types/mcq.js */
/* 四選一：按選項即交卷。鍵盤：左隊 1–4、右隊 Z X C V（由 engine 轉成 position 後呼叫 controller.press）。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};
  T.types = T.types || {};

  function judge(item, response) {
    return Number.isInteger(response) && response === item.answer;
  }

  function render(q, side, el, onSubmit) {
    el.innerHTML = ""; el.className = "body grid2";
    let done = false; const btns = [];
    q.view.forEach((oi, pos) => {
      const b = document.createElement("button"); b.className = "opt"; b.dataset.oi = oi;
      b.innerHTML = `<b>${pos + 1}</b><span>${q.options[oi]}</span>`;
      b.addEventListener("pointerdown", e => { e.preventDefault(); pick(pos); });
      btns.push(b); el.appendChild(b);
    });
    function pick(pos) {
      if (done || !btns[pos]) return; done = true;
      btns[pos].classList.add("picked"); onSubmit(q.view[pos]);
    }
    return {
      lock() { done = true; },
      reveal(correct) {
        btns.forEach(b => { const oi = +b.dataset.oi;
          if (oi === q.answer) b.classList.add("right");
          else if (b.classList.contains("picked")) b.classList.add("wrong");
          else b.classList.add("dim"); });
      },
      press: pick,
    };
  }

  T.types.mcq = { judge, render, limit: 30, submitOnPick: true };
})();

</script>
<script>
/* core/types/numpad.js */
/* 數字輸入：每隊一個 0–9、小數點、負號、退格的鍵盤，按「確定」交卷。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};
  T.types = T.types || {};

  function parse(s) {
    if (typeof s !== "string") return NaN;
    const t = s.trim().replace(/\.$/, "");
    if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
    return Number(t);
  }

  function judge(item, response) {
    const v = parse(response);
    if (Number.isNaN(v)) return false;
    const tol = item.tolerance || 0;
    return Math.abs(v - item.answer) <= tol + 1e-9;
  }

  function render(q, side, el, onSubmit) {
    el.innerHTML = ""; el.className = "body col";
    let done = false, val = "";
    const disp = document.createElement("div"); disp.className = "np-display";
    const unit = q.unit ? `<small>${q.unit}</small>` : "";
    const show = () => { disp.innerHTML = (val || "&nbsp;") + unit; ok.disabled = Number.isNaN(parse(val)); };
    const keys = document.createElement("div"); keys.className = "np-keys";
    ["7", "8", "9", "⌫", "4", "5", "6", "−", "1", "2", "3", ".", "0"].forEach(k => {
      const b = document.createElement("button"); b.textContent = k;
      if (k === "0") b.style.gridColumn = "span 2";
      b.addEventListener("pointerdown", e => { e.preventDefault(); key(k); });
      keys.appendChild(b);
    });
    const ok = document.createElement("button"); ok.className = "confirm"; ok.textContent = "確定";
    ok.addEventListener("pointerdown", e => { e.preventDefault(); submit(); });
    el.append(disp, keys, ok); show();
    function key(k) {
      if (done) return;
      if (k === "⌫") val = val.slice(0, -1);
      else if (k === "−") val = val.startsWith("-") ? val.slice(1) : "-" + val;
      else if (k === ".") { if (!val.includes(".")) val += (val === "" || val === "-") ? "0." : "."; }
      else if (val.replace("-", "").length < 8) val += k;
      show();
    }
    function submit() { if (done || Number.isNaN(parse(val))) return; done = true; ok.disabled = true; onSubmit(val); }
    return {
      lock() { done = true; ok.disabled = true; },
      reveal(correct) {
        disp.classList.add(correct ? "right" : "wrong");
        disp.style.background = correct ? "#CFF3D8" : "#FBD5D3";
        if (!correct) disp.innerHTML = `<s style="opacity:.6">${val || "—"}</s>　${q.answer}${unit}`;
      },
      press() {},
    };
  }

  T.types.numpad = { judge, render, parse, limit: 45, submitOnPick: false };
})();

</script>
<script>
/* core/types/order.js */
/* 排序：3–4 張卡，拖動卡片上下重排（或點兩張交換），按「確定」交卷。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};
  T.types = T.types || {};

  // 比對「排出來的字」而不是卡片索引：像 ba/na/na 有兩張一樣的卡，
  // 學生把兩張 na 對調，讀出來仍然是 banana，必須算對。
  function text(item, arr) {
    return arr.map(i => item.options[i]).join("\u0000");
  }
  function judge(item, response) {
    return Array.isArray(response) && response.length === item.answer.length
      && text(item, response) === text(item, item.answer);
  }
  T.orderText = text;

  function render(q, side, el, onSubmit) {
    el.innerHTML = ""; el.className = "body col";
    let done = false, selected = -1, drag = null;
    let cur = q.view.slice();                      // 目前排列：位置 → 選項索引
    const list = document.createElement("div"); list.className = "ord";
    const ok = document.createElement("button"); ok.className = "confirm"; ok.textContent = "確定";
    ok.addEventListener("pointerdown", e => { e.preventDefault(); submit(); });
    el.append(list, ok);
    function draw() {
      list.innerHTML = "";
      cur.forEach((oi, pos) => {
        const b = document.createElement("button"); b.className = "opt" + (pos === selected ? " sel" : ""); b.dataset.oi = oi;
        b.innerHTML = `<b>${pos + 1}</b><span>${q.options[oi]}</span>`;
        b.addEventListener("pointerdown", e => { e.preventDefault(); startDrag(e, pos, b); });
        list.appendChild(b);
      });
    }
    // 拖拉：按住卡片上下移動即重排；沒有移動就當作點選（點兩張交換）。每張卡各自捕捉指標，兩隊可同時拖。
    function startDrag(e, pos, btn) {
      if (done || drag) return;
      const slots = [...list.children].map(c => c.getBoundingClientRect());
      const rowH = slots.length > 1 ? slots[1].top - slots[0].top : (slots[0] ? slots[0].height : 0);
      drag = { id: e.pointerId, from: pos, to: pos, startY: e.clientY, moved: false };
      try { btn.setPointerCapture(e.pointerId); } catch { /* 舊瀏覽器 */ }
      const move = ev => {
        if (!drag || ev.pointerId !== drag.id) return;
        const dy = ev.clientY - drag.startY;
        if (!drag.moved && Math.abs(dy) < 8) return;
        if (!drag.moved) { drag.moved = true; btn.classList.add("dragging"); }
        btn.style.transform = `translateY(${dy}px)`;
        let to = slots.findIndex(r => ev.clientY < r.top + r.height / 2); if (to === -1) to = slots.length - 1;
        drag.to = to;
        [...list.children].forEach((c, i) => {
          if (i === drag.from) return;
          const shift = (drag.from < i && i <= to) ? -rowH : (to <= i && i < drag.from) ? rowH : 0;
          c.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      };
      const up = ev => {
        if (!drag || ev.pointerId !== drag.id) return;
        btn.removeEventListener("pointermove", move); btn.removeEventListener("pointerup", up); btn.removeEventListener("pointercancel", up);
        const d = drag; drag = null;
        if (d.moved) {
          if (d.to !== d.from) { const [item] = cur.splice(d.from, 1); cur.splice(d.to, 0, item); }
          selected = -1; draw();
        } else tap(pos);
      };
      btn.addEventListener("pointermove", move); btn.addEventListener("pointerup", up); btn.addEventListener("pointercancel", up);
    }
    function tap(pos) {
      if (done) return;
      if (selected === -1) selected = pos;
      else if (selected === pos) selected = -1;
      else { [cur[selected], cur[pos]] = [cur[pos], cur[selected]]; selected = -1; }
      draw();
    }
    function submit() { if (done) return; done = true; ok.disabled = true; selected = -1; draw(); onSubmit(cur.slice()); }
    draw();
    return {
      lock() { done = true; ok.disabled = true; },
      reveal(correct) {
        [...list.children].forEach((b, pos) => b.classList.add(q.options[cur[pos]] === q.options[q.answer[pos]] ? "right" : "wrong"));
        if (!correct) {
          const ans = document.createElement("div"); ans.style.cssText = "font-size:2.6vh;font-weight:700;margin-top:.6vh";
          ans.textContent = "正確順序：" + q.answer.map(oi => q.options[oi]).join(" → ");
          el.appendChild(ans);
        }
      },
      press() {},
    };
  }

  T.types.order = { judge, render, limit: 45, submitOnPick: false };
})();

</script>
<script>
/* core/types/multi.js */
/* 多選：五個選項可切換勾選，按「確定」交卷；必須完全正確。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};
  T.types = T.types || {};

  function judge(item, response) {
    if (!Array.isArray(response) || !response.length) return false;
    const a = [...new Set(response)].sort((x, y) => x - y);
    const b = [...item.answer].sort((x, y) => x - y);
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }

  function render(q, side, el, onSubmit) {
    el.innerHTML = ""; el.className = "body col";
    let done = false; const btns = []; const sel = new Set();
    q.view.forEach((oi, pos) => {
      const b = document.createElement("button"); b.className = "opt"; b.dataset.oi = oi;
      b.innerHTML = `<b>${pos + 1}</b><span>${q.options[oi]}</span>`;
      b.addEventListener("pointerdown", e => { e.preventDefault(); toggle(pos); });
      btns.push(b); el.appendChild(b);
    });
    const ok = document.createElement("button"); ok.className = "confirm"; ok.textContent = "確定"; ok.disabled = true;
    ok.addEventListener("pointerdown", e => { e.preventDefault(); submit(); });
    el.appendChild(ok);
    function toggle(pos) {
      if (done || !btns[pos]) return;
      const oi = q.view[pos];
      if (sel.has(oi)) { sel.delete(oi); btns[pos].classList.remove("picked"); } else { sel.add(oi); btns[pos].classList.add("picked"); }
      ok.disabled = sel.size === 0;
    }
    function submit() { if (done || !sel.size) return; done = true; ok.disabled = true; onSubmit([...sel]); }
    return {
      lock() { done = true; ok.disabled = true; },
      reveal() {
        btns.forEach(b => { const oi = +b.dataset.oi; const chosen = sel.has(oi), right = q.answer.includes(oi);
          if (right) b.classList.add("right");
          else if (chosen) b.classList.add("wrong");
          else b.classList.add("dim");
          if (right && !chosen) b.classList.add("picked"); });
      },
      press: toggle,
    };
  }

  T.types.multi = { judge, render, limit: 30, submitOnPick: false };
})();

</script>
<script>
/* core/audio.js */
/* 配樂與音效：真實音樂與人群歡呼（Mixkit 免授權，build 以 base64 內嵌）加上少量輕柔合成提示音。開局按鈕會解鎖 AudioContext。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};
  let ctx = null, master = null, bgmGain = null, bgmTimer = null, bgmOn = false, muted = false;
  try { muted = localStorage.getItem("tug.muted") === "1"; } catch { /* 無儲存空間也能玩 */ }

    if (!AC) return null;

    master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
    bgmGain = ctx.createGain(); bgmGain.gain.value = 0.16; bgmGain.connect(master);
    return ctx;
  }
  const now = () => (ensure() ? ctx.currentTime : 0);

    o = o || {}; if (!ensure()) return;
    const osc = ctx.createOscillator(), g = ctx.createGain(), out = o.out || master;
    osc.type = o.type || "square"; osc.frequency.setValueAtTime(freq, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + o.slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);

    const g = ctx.createGain(); g.gain.value = vol || 0.2;
    s.connect(f).connect(g).connect(out || master); s.start(t0);
  }
  const SFX = {
    tap()     { const t = now(); tone(880, t, 0.04, { type: "triangle", vol: 0.06 }); },
    submit()  { const t = now(); tone(660, t, 0.07, { type: "triangle", vol: 0.1 }); tone(990, t + 0.08, 0.1, { type: "triangle", vol: 0.1 }); },
    correct() { const t = now(); [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.09, 0.2, { type: "triangle", vol: 0.3 })); },
    wrong()   { const t = now(); tone(330, t, 0.18, { type: "triangle", vol: 0.12 }); tone(262, t + 0.16, 0.28, { type: "triangle", vol: 0.12 }); },
    pull()    { const t = now(); tone(880, t, 0.12, { type: "triangle", vol: 0.16 }); tone(1320, t + 0.1, 0.25, { type: "triangle", vol: 0.16 }); },
    tick()    { const t = now(); tone(1300, t, 0.04, { vol: 0.09 }); },
    timeout() { const t = now(); [0, 0.18, 0.36].forEach(d => tone(440, t + d, 0.15, { type: "triangle", vol: 0.12 })); },
    both()    { const t = now(); tone(330, t, 0.15, { type: "triangle", vol: 0.2 }); tone(262, t + 0.15, 0.3, { type: "triangle", vol: 0.2 }); },
    win()     { const t = now(); [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.12, i === 3 ? 0.6 : 0.14, { type: "triangle", vol: 0.2 })); },
    start()   { const t = now(); [392, 523, 659, 784].forEach((f, i) => tone(f, t + i * 0.1, 0.16, { type: "triangle", vol: 0.18 })); },
  };

  // 背景音樂：132 BPM、8 小節循環，C 大調運動會風；旋律方波、低音三角波、輕微踩鈸
  const BPM = 132, BEAT = 60 / BPM;
  const MEL = [72, 74, 76, 79, 76, 74, 72, 0, 69, 72, 74, 76, 74, 72, 69, 0, 67, 69, 72, 74, 76, 74, 72, 74, 76, 79, 76, 74, 72, 0, 79, 0];
  const BASS = [48, 48, 53, 53, 55, 55, 55, 48];
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  let nextBeat = 0, beatIdx = 0;
  function schedule() {
    if (!ctx) return;

      const i = beatIdx % 32, bar = Math.floor(i / 4), sub = i % 4;
      if (MEL[i]) tone(midi(MEL[i]), nextBeat, BEAT * 0.85, { type: "square", vol: 0.11, out: bgmGain });
      tone(midi(BASS[bar] + (sub % 2 ? 7 : 0)), nextBeat, BEAT * 0.5, { type: "triangle", vol: 0.22, out: bgmGain });
      if (sub % 2 === 0) noise(nextBeat, 0.04, 0.05, bgmGain);
      nextBeat += BEAT; beatIdx++;
    }
  }
  // 配樂：真實音樂（Mixkit「Owies Ukulele」48.6 秒片段）循環播放；合成旋律已停用
  let musicSrc = null, wantBgm = false;
  const BGM_VOL = 0.34, BGM_DUCK = 0.12;
  function startBgm() {
    if (!ensure()) return; wantBgm = true;
    if (musicSrc || !clips.music) return;          // 尚未解碼：decodeClips 完成後會再呼叫
    const h = playClip("music", 0.0001, true); if (!h) return;
    musicSrc = h; h.gain.gain.setTargetAtTime(BGM_VOL, ctx.currentTime, 0.6); bgmOn = true;
  }
  function stopBgm() { wantBgm = false; bgmOn = false; if (!musicSrc) return; const h = musicSrc; musicSrc = null; h.gain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.5); setTimeout(() => { try { h.src.stop(); } catch { /* 已停 */ } }, 2000); }
  function duck(on) { if (musicSrc) musicSrc.gain.gain.setTargetAtTime(on ? BGM_DUCK : BGM_VOL, now(), 0.15); }
  // 真實人群音效（build 以 base64 內嵌於 TUG_SFX）：解碼後用 BufferSource 播放，同樣經過 master，靜音一起生效
  const clips = {}; let decoding = false, crowdSrc = null, crowdGain = null;
  function decodeClips() {
    const src = typeof TUG_SFX !== "undefined" ? TUG_SFX : {};
    if (decoding || !ensure()) return; decoding = true;
    Object.keys(src).forEach(name => {
      fetch(src[name]).then(r => r.arrayBuffer()).then(buf => ctx.decodeAudioData(buf)).then(dec => { clips[name] = dec; if (name === "music" && wantBgm) startBgm(); }).catch(() => {});
    });
  }
  function playClip(name, vol, loop) {
    if (!clips[name] || !ensure()) return null;
    const s = ctx.createBufferSource(); s.buffer = clips[name]; s.loop = !!loop;
    const g = ctx.createGain(); g.gain.value = vol || 0.8; s.connect(g).connect(master); s.start();
    return { src: s, gain: g };
  }
  const cheerNames = ["cheer1", "cheer2", "cheer3"];
  function startCrowd() { if (crowdSrc || !clips.crowd) return; const h = playClip("crowd", 0.0001, true); if (!h) return; crowdSrc = h.src; crowdGain = h.gain; crowdGain.gain.setTargetAtTime(0.22, ctx.currentTime, 0.8); }
  function stopCrowd() { if (!crowdSrc) return; const s = crowdSrc, g = crowdGain; crowdSrc = null; g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.4); setTimeout(() => { try { s.stop(); } catch { /* 已停 */ } }, 1500); }
  function unlock() { const c = ensure(); if (c && c.state === "suspended") c.resume(); decodeClips(); }
  function setMuted(m) { muted = !!m; if (master) master.gain.setTargetAtTime(muted ? 0 : 1, now(), 0.02); try { localStorage.setItem("tug.muted", muted ? "1" : "0"); } catch { /* 忽略 */ } }
  T.audio = {
    unlock, startBgm, stopBgm, duck, setMuted, isMuted: () => muted, startCrowd, stopCrowd,
    clipsReady: () => Object.keys(clips).length,
    play(name) {
      if (muted) return; ensure();
      if (name === "cheer") { playClip(cheerNames[Math.floor(Math.random() * cheerNames.length)], 0.9); return; }
      if (name === "aww") { playClip("aww", 0.7); return; }
      if (name === "winclip") { playClip("win", 1.0); return; }
      if (name === "wrong") return;              // 答錯只用失望聲，不再疊合成蜂鳴
      if (SFX[name]) SFX[name]();
    },
  };
})();

</script>
<script>
/* games/tug/game.js */
/* games/tug/game.js —— 拔河遊戲殼：計分（誰拉幾格）、繩子與兩隊小孩的場景。
   純邏輯（T.PULL、T.resolve）放在最前面，沒有 document 也能 require 進 node 測。
   介面見 CONTRACT.md 的 TUG.game。 */
(function () {
  const T = globalThis.TUG = globalThis.TUG || {};

  // 每題答對可以拉幾格，依層次給
  T.PULL = { "知道": 1, "應用": 1, "推理": 2 };

  // 計分：delta < 0 繩結向紅隊（左），> 0 向藍隊（右）
  T.resolve = function ({ pull, ok, ms }) {
    const m = ms.map(v => (typeof v === "number" ? v : Infinity));
    if (ok[0] && ok[1]) {
      if (m[0] === m[1]) return { delta: 0, who: null, msg: "都答對，一樣快！" };
      const fast = m[0] < m[1] ? 0 : 1;
      return { delta: fast === 0 ? -1 : 1, who: fast, msg: "都答對，較快的多拉一格！" };
    }
    if (ok[0]) return { delta: -pull, who: 0, msg: "拉！" };
    if (ok[1]) return { delta: pull, who: 1, msg: "拉！" };
    return { delta: 0, who: null, msg: "都不夠力！" };
  };

  // ======================================================== 以下只在瀏覽器執行
  if (typeof document === "undefined") return;
  const $ = id => document.getElementById(id);
  const STEP = 60;   // 每拉一格，繩子、繩結與兩隊一起移動 60 個 viewBox 單位
  let S = null;      // 由 setup() 收下 shell 的共享狀態

  function updateRope() {
    // 繩結固定在繩子的 800 處；整條繩（含繩結）與兩隊一起平移，像真的拔河一樣
    const dx = S.pos * STEP, ease = "transform .7s cubic-bezier(.2,1.3,.4,1)";
    $("knot").style.transform = "translate(800px,0)";
    $("knotTxt").textContent = S.pos === 0 ? "0" : (S.pos < 0 ? "\u25C0 " + (-S.pos) : S.pos + " \u25B6");
    ["ropeG", "teamL", "teamR"].forEach(id => { $(id).style.transition = ease; $(id).style.transform = `translate(${dx}px,0)`; });
  }

  // 畫一隊四個卡通小學生：面向中線、身體向後傾、雙手握繩、前腳蹬後腳撐。座標以腳底 (x, 292) 為原點，繩在 y=205（局部約 -95，經 0.8–0.9 縮放後仍對到繩）。
  function drawTeam(gid, side) {
    const col = side ? "#2457E6" : "#E8413C", dark = side ? "#183FA8" : "#B72E2A";
    const skins = side ? ["#BB8058", "#F1C7A0", "#DFAB7E", "#F7D6B2"] : ["#F1C7A0", "#C38A61", "#F7D6B2", "#DFAB7E"];
    const hairs = ["#33312B", "#604131", "#33312B", "#835035"];
    let art = "";
    for (let i = 0; i < 4; i++) {
      const x = side ? 1050 + i * 112 : 550 - i * 112, skin = skins[i], hair = hairs[i];
      const style = (i + side * 2) % 4;
      const hairArt = [
        `<path d="M-39-145q-9-45 31-45 31-4 37 26l-17-6-8 13-15-8-14 18Z" fill="${hair}"/>`,
        `<path d="M-36-154q-8-33 25-38 33-3 42 28l-20-4-13 11-16-9Z" fill="${hair}"/><path d="M-37-170q-34-11-32 17 1 25-19 28 39 12 43-25" fill="${hair}"/><path d="M-44-167l11 9" stroke="${col}" stroke-width="9"/>`,
        `<path d="M-40-151l-4-25 13 1 5-20 13 9 16-13 8 15 17-4 4 25-21-7-11 12-14-7Z" fill="${hair}"/>`,
        `<path d="M-38-148q-17-42 22-45 47-4 48 41l-20-13-16 8-16-7-5 18Z" fill="${hair}"/>`
      ][style];
      art += `<g class="kid kid-${i}" transform="translate(${x},292) scale(${side ? -1 : 1},1)">
        <ellipse cx="-8" cy="2" rx="49" ry="7" fill="#24332E" opacity=".18"/>
        <g class="dust" fill="#FFFCEF"><ellipse cx="-48" cy="-4" rx="15" ry="8"/><circle cx="-63" cy="-13" r="7"/><circle cx="39" cy="-7" r="8"/></g>
        <g class="kid-motion" stroke="#24332E" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M-19-59L-36-33-50-10M7-59L29-39 21-10" fill="none" stroke="#24332E" stroke-width="19"/>
          <path d="M-19-59L-36-33-50-10M7-59L29-39 21-10" fill="none" stroke="${skin}" stroke-width="11"/>
          <path d="M-44-20l-6 10m73-10-2 10" stroke="#FFFCEF" stroke-width="13"/>
          <path d="M-57-13q-9 3-8 13h33q6-8-11-13Z M17-13q-8 3-8 13h35q2-10-16-13Z" fill="#FFFCEF"/>
          <path d="M-62-3h26M13-3h27" stroke="${col}" stroke-width="5"/>
          <path d="M-31-80h54l-2 28H1l-5-10-5 10h-24Z" fill="${dark}"/>
          <path d="M-34-132q22-10 43 4l17 51q-31 10-58-1Z" fill="${col}"/>
          <path d="M-30-111l10 29 43-4 3 9q-29 10-58-1Z" fill="${dark}" stroke="none"/>
          <path d="M-25-133q10 16 24 4" fill="#FFFCEF"/>
          <text x="-7" y="-95" text-anchor="middle" fill="#FFFCEF" stroke="none" font-size="23" font-weight="900" transform="${side ? 'translate(-14,0) scale(-1,1)' : ''}">${i + 1 + side * 4}</text>
          <path d="M-21-116L3-96 40-87M9-115L28-99 57-87" fill="none" stroke="#24332E" stroke-width="17"/>
          <path d="M-21-116L3-96 40-87M9-115L28-99 57-87" fill="none" stroke="${skin}" stroke-width="10"/>
          <path d="M-26-121l11 11m20-11 9 10" stroke="${col}" stroke-width="18"/>
          <ellipse cx="-5" cy="-152" rx="34" ry="31" fill="${skin}"/>
          <path d="M18-172q18 16 4 34" fill="none" stroke="#A96F4F" stroke-width="5" opacity=".4"/>
          <circle cx="-33" cy="-148" r="8" fill="${skin}"/>
          ${hairArt}
          ${i === 3 ? `<path d="M-39-174q20-21 52-4l7 10h-58Z" fill="${col}"/><path d="M5-171h37q4 8-9 9H6Z" fill="${dark}"/>` : `<path d="M-34-174q26-7 54 3" stroke="#FFFCEF" stroke-width="7"/>`}
          <path d="M-5-154l8 3m12-2 7-5" fill="none"/>
          <path d="M1-146v2m17-3v2" stroke-width="5"/>
          ${i === 1 ? '<g fill="none" stroke-width="3"><rect x="-9" y="-151" width="16" height="14" rx="5"/><rect x="12" y="-154" width="15" height="14" rx="5"/><path d="M7-146h5m-21 2-19-5"/></g>' : ''}
          <path d="M5-131q8-7 16-2l-2 8Z" fill="#FFFCEF" stroke-width="3"/>
          <ellipse cx="-10" cy="-135" rx="7" ry="4" fill="#E48D78" stroke="none"/>
          <path d="M35-88q-4-13 5-14 8 0 9 14M51-88q-3-13 5-14 9 0 10 14" fill="${skin}"/>
          <path d="M39-97v7m5-6v6m12-7v7m5-6v6" stroke="#A96F4F" stroke-width="2"/>
        </g>
      </g>`;
    }
    $(gid).innerHTML = art;
  }

  T.game = {
    id: "tug",

    // 開局：讀「拉過幾格獲勝」、繩結歸零、擺好終點線與兩隊
    setup(state) {
      S = T.S = state;
      S.winAt = +$("winAt").value;
      S.pos = 0;
      const gl = 800 - S.winAt * STEP, gr = 800 + S.winAt * STEP;
      $("goalL").setAttribute("x1", gl); $("goalL").setAttribute("x2", gl);
      $("goalR").setAttribute("x1", gr); $("goalR").setAttribute("x2", gr);
      drawTeam("teamL", 0); drawTeam("teamR", 1);
      updateRope();
    },

    tagText(q) { return `答對拉 ${T.PULL[q.level]} 格`; },

    resolve({ q, ok, ms }) {
      const r = T.resolve({ pull: T.PULL[q.level], ok, ms });
      S.pos += r.delta;
      updateRope();
      return { who: r.who, msg: r.msg };
    },

    isOver() { return Math.abs(S.pos) >= S.winAt; },

    finish() {
      const w = S.pos < 0 ? 0 : S.pos > 0 ? 1 : null;
      const line = Math.abs(S.pos) >= S.winAt
        ? "把繩子拉過線了！"
        : `${S.items.length} 題答完，繩結偏向 ${w === null ? "中間" : S.names[w]}`;
      return { winner: w, line };
    },
  };
})();

</script>
<script>
/* core/shell.js */
/* core/shell.js —— 兩隊搶答的通用流程：開始畫面、出題、作答、判分、計時、紀錄、結束畫面。
   遊戲本身（拔河的繩子、井字的棋盤）由 TUG.game 提供，介面見 games/README。
   這一層完全不知道題目在考什麼，也不知道贏的方式是什麼。 */
(function () {
  const T = globalThis.TUG;
  if (typeof document === "undefined") return;
  const $ = id => document.getElementById(id);
  const G = T.game;                                   // 由 games/<id>/game.js 註冊
  const bank = typeof TUG_BANK !== "undefined" ? TUG_BANK : [];
  const topicText = typeof TUG_TOPICS !== "undefined" ? TUG_TOPICS : {};
  const meta = typeof TUG_META !== "undefined" ? TUG_META : {};
  const taughtTable = typeof TUG_TAUGHT !== "undefined" ? TUG_TAUGHT : {};
  const R = T.records(null, meta.id);

  const S = T.S = {
    names: ["紅隊", "藍隊"], items: [], qi: 0, q: null, ctrl: [null, null], resp: [null, null], ms: [null, null],
    qStart: 0, timer: null, tleft: 0, limitScale: 1, stats: [[0, 0], [0, 0]], bothWrong: [], session: "", rows: [],
  };

  const TYPE_NAME = { mcq: "四選一", numpad: "輸入數字", order: "排順序", multi: "選出所有正確的" };
  function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("on")); $(id).classList.add("on"); }
  function on(id, ev, fn) { const el = $(id); if (el) el.addEventListener(ev, fn); }
  function taughtSet(today) {
    const s = new Set();
    for (const d in taughtTable) if (d < today) taughtTable[d].forEach(t => s.add(t));
    return s;
  }

  // ---------- 開始畫面 ----------
  const orderedTopics = [...new Set(bank.map(i => i.topic))].sort();
  {
    const n = bank.length, g = meta.groupKey;
    // 「已出過」只算這個瀏覽器的紀錄：換一部機、換一個網址就是另一份記憶
    const asked = R.recentMap().size;
    $("bankinfo").textContent = (g
      ? `題庫 ${n} 題（` + (meta.groups || []).map(v => `${v} ${bank.filter(i => i[g] === v).length}`).join("、") + "）"
      : `題庫 ${n} 題 · ${orderedTopics.length} 個${meta.topicLabel || "單元"}`)
      + ` · 這個瀏覽器已出過 ${asked} 題（14 天內不重出）`;
  }
  {
    const sel = $("scope"), modes = meta.scopes || ["all"], label = meta.topicLabel || "單元";
    const add = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); };
    if (modes.includes("taught")) {
      const ts = taughtSet(T.todayStr());
      add("taught", "跟進度（已教為主、其餘全範圍）");
      $("startNote").textContent = ts.size ? `已教${label} ${ts.size} 個、${bank.filter(i => ts.has(i.topic)).length} 題（依課表，${T.todayStr()}）`
                                           : "學期尚未開始，「跟進度」會自動改為全範圍";
    }
    add("all", `全部${label}`);
    if (modes.includes("upto")) {
      orderedTopics.forEach(t => add(`upto:${t}`, `教到 ${t} ${topicText[t] || ""}`.trim()));
      if (!modes.includes("taught")) $("startNote").textContent = `選「教到 ⋯」：七成出該${label}、三成複習之前學過的`;
    }
    if (modes.includes("only")) orderedTopics.forEach(t => add(`only:${t}`, `只出 ${t} ${topicText[t] || ""}`.trim()));
    const keep = localStorage.getItem("tug.scope." + meta.id);
    if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
    else sel.value = modes.includes("taught") ? "taught" : "all";
    sel.addEventListener("change", () => { try { localStorage.setItem("tug.scope." + meta.id, sel.value); } catch {} });
  }
  if ($("group") && meta.groupKey) {                   // 題庫有分組（例如 TIMSS 的科目）才顯示
    $("groupLabel").hidden = false;
    ["混合"].concat(meta.groups || []).forEach(v => {
      const o = document.createElement("option"); o.value = v;
      o.textContent = v === "混合" ? (meta.groups || []).join("＋") : v; $("group").appendChild(o);
    });
  }

  document.querySelector(".sides").addEventListener("pointerdown", e => { if (e.target.closest("button")) T.audio.play("tap"); }, true);
  const muteBtn = $("muteBtn");
  const drawMute = () => { muteBtn.textContent = T.audio.isMuted() ? "聲音：關" : "聲音：開"; };
  drawMute(); muteBtn.addEventListener("click", () => { T.audio.setMuted(!T.audio.isMuted()); drawMute(); });
  on("startBtn", "click", startGame);
  on("exportBtn", "click", () => {
    const rows = R.load(); if (!rows.length) { alert("還沒有紀錄。"); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([R.toCSV(rows)], { type: "text/csv;charset=utf-8" }));
    a.download = `${meta.name || "遊戲"}紀錄_${T.todayStr()}.csv`; a.click();
  });
  on("clearBtn", "click", () => {
    if (confirm("確定清除全部作答紀錄？建議先匯出。") && confirm("真的要清除嗎？此動作不能復原。")) { R.clear(); alert("已清除。"); }
  });
  on("againBtn", "click", () => location.reload());
  on("fsBtn", "click", toggleFS);
  on("nextBtn", "click", nextQuestion);
  function toggleFS() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }

  function startGame() {
    S.names = [$("nameL").value.trim() || "紅隊", $("nameR").value.trim() || "藍隊"];
    S.limitScale = +$("tlimit").value;
    const today = T.todayStr();
    const r = T.pick(bank, {
      n: +$("nq").value, scope: $("scope").value, orderedTopics,
      groupKey: meta.groupKey, group: $("group") ? $("group").value : null,
      taughtSet: taughtSet(today), recent: R.recentMap(), today,
    });
    if (!r.items.length) { alert("這個範圍沒有題目。"); return; }
    S.items = r.items; S.qi = 0; S.stats = [[0, 0], [0, 0]]; S.bothWrong = []; S.rows = [];
    S.session = today.replace(/-/g, "") + "-" + new Date().toTimeString().slice(0, 5).replace(":", "");
    $("scoreL").textContent = S.names[0]; $("scoreR").textContent = S.names[1];
    $("head0").textContent = S.names[0] + " 這邊答"; $("head1").textContent = "這邊答 " + S.names[1];
    G.setup(S);
    if (r.notes.fallbackAll) callout("全範圍", null);
    T.audio.unlock(); T.audio.play("start"); T.audio.startBgm();
    show("game"); nextQuestion();
  }

  // ---------- 一題 ----------
  function nextQuestion() {
    $("game").classList.remove("acting");
    if (S.qi >= S.items.length) { finish(); return; }
    const q = S.q = T.prepareView(S.items[S.qi], Math.random);
    const mod = T.types[q.type];
    $("qno").textContent = `第 ${S.qi + 1}／${S.items.length} 題`;
    $("domTag").textContent = `${q.topic} · ${topicText[q.topic] || ""} · ${q.level}`.replace(" ·  ·", " ·");
    $("pullTag").textContent = G.tagText(q);
    $("typeTag").textContent = TYPE_NAME[q.type];
    $("qtext").innerHTML = q.stem;
    $("why").className = "why"; $("why").textContent = ""; $("nextBtn").className = "next";
    S.resp = [null, null]; S.ms = [null, null]; S.qStart = Date.now();
    delete $("game").dataset.result;
    T.audio.duck(false);
    [0, 1].forEach(side => {
      $("side" + side).classList.remove("done", "locked");
      S.ctrl[side] = mod.render(q, side, $("body" + side), resp => submit(side, resp));
    });
    startTimer(Math.round(mod.limit * S.limitScale));
  }
  function submit(side, resp) {
    if (S.resp[side] !== null) return;
    S.resp[side] = resp; S.ms[side] = Date.now() - S.qStart;
    $("side" + side).classList.add("done"); T.audio.play("submit");
    if (S.resp[0] !== null && S.resp[1] !== null) judge();
  }
  function judge() {
    stopTimer();
    const q = S.q, mod = T.types[q.type];
    [0, 1].forEach(side => { S.ctrl[side].lock(); $("side" + side).classList.add("locked"); });
    const ok = [0, 1].map(side => S.resp[side] !== null && mod.judge(q, S.resp[side]));
    const ms = [0, 1].map(side => S.resp[side] !== null ? S.ms[side] : null);
    [0, 1].forEach(side => { S.stats[side][ok[side] ? 0 : 1]++; S.ctrl[side].reveal(ok[side]); });
    if (!ok[0] && !ok[1]) S.bothWrong.push(q);
    const r = G.resolve({ q, ok, ms });
    const timedOut = S.resp.some(x => x === null);
    $("game").dataset.result = r.who === null ? (timedOut ? "timeout" : "none") : String(r.who);
    callout(timedOut && !ok[0] && !ok[1] ? "時間到！" : r.msg, r.who);
    T.audio.duck(true);
    if (r.who !== null) { T.audio.play("pull"); T.audio.play("cheer"); setTimeout(() => T.audio.play("correct"), 250); }
    else if (ok[0] && ok[1]) { T.audio.play("correct"); T.audio.play("cheer"); }
    else { T.audio.play(timedOut ? "timeout" : "wrong"); T.audio.play("aww"); }
    $("why").textContent = ((ok[0] && ok[1]) ? "✓ " : "正確答案：" + answerText(q) + "　") + q.explain;
    $("why").classList.add("show");
    const row = { date: T.todayStr(), session_id: S.session, item_id: q.id, topic: q.topic, level: q.level, type: q.type,
      red_correct: ok[0] ? 1 : 0, blue_correct: ok[1] ? 1 : 0, red_ms: ms[0] ?? "", blue_ms: ms[1] ?? "", repeat: q.repeat ? 1 : 0 };
    S.rows.push(row); R.append([row]);
    S.qi++;
    // 需要互動（例如井字要擺子）就先交給遊戲，做完才顯示「下一題」
    if (r.pending && r.pending.length && G.act) {
      $("game").classList.add("acting");
      G.act(r.pending, afterAction);
    } else afterAction();
  }
  function afterAction() {
    $("game").classList.remove("acting");
    if (G.isOver()) { setTimeout(finish, 1400); return; }
    $("nextBtn").classList.add("show");
  }
  function answerText(q) {
    if (q.type === "mcq") return q.options[q.answer];
    if (q.type === "numpad") return q.answer + (q.unit || "");
    if (q.type === "order") return q.answer.map(i => q.options[i]).join(" → ");
    return q.answer.map(i => q.options[i]).join("、");
  }

  // ---------- 計時 ----------
  function startTimer(limit) {
    stopTimer(); const box = $("timerBox"), bar = $("timerBar");
    if (!limit) { box.style.visibility = "hidden"; return; }
    box.style.visibility = "visible"; S.tleft = limit;
    bar.className = ""; bar.style.transition = "none"; bar.style.width = "100%";
    requestAnimationFrame(() => { bar.style.transition = "width 1s linear"; });
    S.timer = setInterval(() => {
      S.tleft--; bar.style.width = (S.tleft / limit * 100) + "%";
      if (S.tleft <= 5) { bar.className = "low"; if (S.tleft > 0) T.audio.play("tick"); }
      if (S.tleft <= 0) { stopTimer(); judge(); }
    }, 1000);
  }
  function stopTimer() { clearInterval(S.timer); S.timer = null; }

  T.callout = callout;
  function callout(txt, side) {
    const c = $("callout"); c.textContent = txt;
    c.style.color = side === null ? "#1F2233" : (side ? "#2457E6" : "#E8413C");
    c.classList.add("show"); setTimeout(() => c.classList.remove("show"), 1100);
  }

  // ---------- 結束 ----------
  function finish() {
    const f = G.finish();
    stopTimer(); T.audio.stopBgm(); T.audio.play(f.winner === null ? "both" : "win");
    if (f.winner !== null) T.audio.play("winclip");
    $("win").className = "screen on " + (f.winner === null ? "draw" : f.winner ? "blue" : "red");
    document.querySelectorAll(".screen").forEach(s => { if (s.id !== "win") s.classList.remove("on"); });
    $("winName").textContent = f.winner === null ? "平手！" : S.names[f.winner] + " 勝利！";
    $("winLine").textContent = f.line;
    $("winStats").textContent = `${S.names[0]} 答對 ${S.stats[0][0]} 題、答錯 ${S.stats[0][1]} 題　｜　${S.names[1]} 答對 ${S.stats[1][0]} 題、答錯 ${S.stats[1][1]} 題`;
    $("winMiss").textContent = S.bothWrong.length
      ? "兩隊都答錯：" + [...new Set(S.bothWrong.map(q => `${q.topic}（${q.level}）`))].join("、") + " —— 值得回課堂補一補"
      : "沒有兩隊都答錯的題目。";
  }

  // ---------- 鍵盤（老師用） ----------
  document.addEventListener("keydown", e => {
    if (!$("game").classList.contains("on")) return;
    if ((e.key === " " || e.key === "Enter") && $("nextBtn").classList.contains("show")) { e.preventDefault(); nextQuestion(); return; }
    if (e.key.toLowerCase() === "f") { toggleFS(); return; }
    if ($("game").classList.contains("acting")) return;
    if (!S.q || !S.ctrl[0]) return;
    const kL = "1234".indexOf(e.key), kR = "zxcv".indexOf(e.key.toLowerCase());
    if (kL > -1) S.ctrl[0].press(kL);
    if (kR > -1) S.ctrl[1].press(kR);
  });
})();

</script>
</body>
</html>
